<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Brand reference</title>
<style>
  body { background:#F7F4EE; font-family: Arial, sans-serif; margin: 24px; }
  .row { display:flex; gap:40px; flex-wrap:wrap; align-items:flex-start; margin-bottom:36px; }
  .cell { text-align:center; }
  canvas, img { border:1px solid #bbb; background: repeating-conic-gradient(#ececec 0 25%, #fff 0 50%) 0 0/14px 14px; }
  .cap { font-size:12px; margin-top:6px; max-width:240px; }
</style>
</head>
<body>
  <h1>Logo source (public/logo-vasseur.png)</h1>
  <div class="row">
    <div class="cell"><img src="/logo-vasseur.png" style="width:560px" /><div class="cap">full logo (source)</div></div>
  </div>
  <h1>Candidates (each shown 96&times;96)</h1>
  <div class="row" id="cands"></div>
<script>
  const img = new Image();
  img.onload = () => {
    const cands = document.getElementById('cands');
    const defs = [
      { name: 'A — whole left square (x76-560, y282-774)', x: 76, y: 282, w: 483, h: 492 },
      { name: 'B — emblem/roof area (x60-600, y240-480)', x: 60, y: 240, w: 540, h: 240 },
      { name: 'C — roof wedge tight (x120-600, y250-470)', x: 120, y: 250, w: 480, h: 220 },
      { name: 'D — full logo (contain, transparent)', full: true },
    ];
    for (const d of defs) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const c = document.createElement('canvas');
      c.width = c.height = 96;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      if (d.full) {
        const scale = Math.min(86 / img.width, 86 / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (96 - w) / 2, (96 - h) / 2, w, h);
      } else {
        const side = Math.max(d.w, d.h);
        const pad = 4;
        ctx.drawImage(img, d.x, d.y, d.w, d.h, pad, pad, 96 - 2 * pad, 96 - 2 * pad);
      }
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = d.name;
      cell.append(c, cap);
      cands.append(cell);
    }
  };
  img.src = '/logo-vasseur.png';
</script>
</body>
</html>
